### INSTALLATION NOTES ###
# 1. Install Homebrew (https://github.com/Homebrew/brew)
# 2. Install Zsh: `brew install zsh`
# 3. Install OhMyZsh (https://github.com/ohmyzsh/ohmyzsh)
# 4. Install reattach-to-user-namespace: `brew install reattach-to-user-namespace`
# 4.1. Set default command to Zsh with reattach:
#      set-option -g default-command "reattach-to-user-namespace -l zsh"
# 5. Install iTerm2 (https://iterm2.com/)
# 6. In iTerm2 preferences for your profile set:
#      - Character Encoding: Unicode (UTF-8)
#      - Report Terminal Type: xterm-256color
#
# tmux cheat sheet: https://gist.github.com/michaellihs/b6d46fa460fa5e429ea7ee5ff8794b96

# Default command
set-option -g default-command "reattach-to-user-namespace -l zsh"

### LOOK & FEEL ###
# Set the terminal type to 256 colors
set -g default-terminal "xterm-256color"

# Status bar colors
set-option -g status-bg colour235
set-option -g status-fg colour179
set-option -g status-attr default

# Window title colors
set-window-option -g window-status-fg colour244
set-window-option -g window-status-bg default

# Active window title colors
set-window-option -g window-status-current-fg colour166
set-window-option -g window-status-current-bg default
set-window-option -g window-status-current-attr bright

# Pane border colors
set-option -g pane-border-fg colour235
set-option -g pane-active-border-fg colour240

# Pane number display colors
set-option -g display-panes-active-colour colour33
set-option -g display-panes-colour colour166

# Clock color
set-window-option -g clock-mode-colour colour64

# Status bar right contents
set -g status-right-length 65
set -g status-interval 5

# Enable mouse mode for pane and window selection
set-option -g mouse on

# UTF-8 support
set-window-option -g utf8 on

# Vi mode for status and mode keys
set-option -g status-keys vi
set-option -g mode-keys vi

# No delay for command input
set -sg escape-time 0

# Count windows and panes from 1
set -g base-index 1
setw -g pane-base-index 1

### KEY BINDINGS ###
# Change prefix key to Ctrl-a
unbind C-b
set-option -g prefix C-a
bind C-a send-prefix

# Window and pane management
bind / last-window
bind s split-window -v
bind v split-window -h

# Pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Swap panes
bind '{' swap-pane -U
bind '}' swap-pane -D

# Select last pane
unbind o
bind o select-pane -t :.-

# Reload tmux configuration
bind r source-file ~/.config/.tmux.conf \; display-message "Config reloaded"

# Copy and paste in tmux
bind Escape copy-mode
bind p paste-buffer

# Vi-mode bindings for copy mode
bind -T copy-mode-vi 'v' send -X begin-selection
bind -T copy-mode-vi 'y' send -X copy-selection

# Window navigation
unbind [
bind [ previous-window
unbind ]
bind ] next-window

# Quick window command with htop as default
bind C-q command-prompt -I "htop" -p "Quick window command: " "new-window '%%'"

# Session management
bind C-s choose-session

# Clipboard integration for macOS
bind C-c run "tmux save-buffer - | pbcopy"
bind C-v run "tmux set-buffer \"$(pbpaste)\"; tmux paste-buffer"
